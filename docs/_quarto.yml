project:
  type: website
  output-dir: _site
  resources:
    - notebooks
    - scripts
    - figures
    - objects.txt
    - thumbnails
  pre-render:
    - python scripts/sync_notebooks.py
    - python scripts/generate_tutorials_index.py
    - python scripts/inject_doc_figures.py

metadata-files:
  - api/_sidebar.yml

filters:
  - "interlinks"

interlinks:
  fast: true
  autolink: true
  sources:
    numpy:
      url: https://numpy.org/doc/stable/
    python:
      url: https://docs.python.org/3/
    cedarkit:
      url: /
      inv: objects.txt
  aliases:
    pandas: pd

execute:
  freeze: true

website:
  title: "CedarKit"
  description: "CCM–EDM Data Analysis Routines: supporting tools for CCM/EDM workflows, data structures, configuration parsing, and HPC pipelines."
  page-navigation: true
  navbar:
    title: false
    # logo: thumbnails/logo.png
    logo-alt: "CedarKit"
    left:
      - file: get-started/installation.qmd
        text: Get Started
      - file: tutorials/index.qmd
        text: Tutorials
      - href: api/index.qmd
        text: Reference

    right:
      - icon: github
        href: https://github.com/jordanplanders/cedar_util

  sidebar:
    - id: get-started
      title: Get Started
      style: floating
      align: left
      contents:
        - get-started/overview.qmd
        - section: "Basic Use"
          contents:
          - get-started/installation.qmd
          - get-started/quickstart.qmd

    - id: tutorials
      title: Tutorials
      style: floating
      align: left
      contents:
        - tutorials/index.qmd
        - section: "Getting started"
          contents:
            - text: "Placeholder"
              href: notebooks/base_classes/placeholder.ipynb

        - section: "Model demos"
          contents:
            - text: "Placeholder"
              href: notebooks/model_demos/placeholder.ipynb

        - section: "Functionality demos"
          contents:
            - text: "Placeholder"
              href: notebooks/functionality_demos/placeholder.ipynb

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 5
    toc-location: right
    include-after-body: _version-picker.html
    css:
      - api/_styles-quartodoc.css
      - styles.css

quartodoc:
  style: pkgdown
  dir: api
  package: cedarkit
  out_index: index.qmd
  render_interlinks: true
  renderer:
    style: markdown
    table_style: description-list
  sidebar: "api/_sidebar.yml"
  css: "api/_styles-quartodoc.css"

  sections:
    - title: Core - Configuration & Data Model
      desc: |
        Project configuration, per-variable timeseries loading, CCM run
        configuration, and the output/relationship objects a run produces.
      contents:
        - core.project_config.load_config
        - core.data_var.VarObject
        - core.relationship.Relationship
        - core.data_objects.RunConfig
        - core.data_objects.CCMConfig
        - core.data_objects.DataGroup
        - core.data_objects.OutputCollection
        - core.data_objects.merge_variable_ts

    - title: Visualization - Grids & Panels
      desc: |
        Multi-panel figure layout (``GridPlot``/``SummaryGrid``) and the
        individual panel types (``viz.panels``) placed into them.
      contents:
        - viz.grids.GridPlot
        - viz.grids.GridCell
        - viz.grids.SummaryGrid
        - viz.panels.BasePlot
        - viz.panels.LibSizeRhoPlot
        - viz.panels.LagPlot
        - viz.panels.ResultsGrid
        - viz.panels.SimplexGrid

    - title: Running CCM Experiments
      desc: Executing a single CCM run and persisting its output.
      contents:
        - utils.experiments.ccm.run_experiment
        - utils.experiments.ccm.write_to_file

    - title: Workflow - Parameters & Slurm
      desc: Building, deduplicating, and dispatching CCM parameter sweeps.
      contents:
        - utils.workflow.parameter_utils.make_comb_df
        - utils.workflow.parameter_utils.process_params_group
        - utils.workflow.parameter_utils.tidy_up_params
        - utils.workflow.slurm_tools.gen_parameters_slurm2

    - title: Routing & I/O
      desc: Resolving project paths, filenames, and cloudpickle-backed joblib I/O.
      contents:
        - utils.routing.paths.check_location
        - utils.routing.paths.set_calc_path
        - utils.routing.paths.set_output_path
        - utils.routing.file_name_parsers.check_csv
        - utils.io.cloudjoblib.joblib_cloud_load
        - utils.io.cloudjoblib.joblib_cloud_atomic_dump
        - utils.io.timeseries_utils.remove_extra_index

    - title: CLI Utilities
      desc: Common argument parsing, logging setup, and file-handling decisions for scripts.
      contents:
        - utils.cli.arg_parser.get_parser
        - utils.cli.arg_parser.parse_flags
        - utils.cli.logging.setup_logging
        - utils.cli.logging.log_line
        - utils.io.gonogo.decide_file_handling
